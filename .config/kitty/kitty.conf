# ==============================================================================
# Kitty Configuration - Optimized for Linux & Terminator Workflow
# ==============================================================================

# Shell por defecto
shell /usr/bin/zsh

# ------------------------------------------------------------------------------
# Tipografía
# ------------------------------------------------------------------------------
font_family      MesloLGS NF Regular
bold_font        MesloLGS NF Bold
italic_font      MesloLGS NF Italic
bold_italic_font MesloLGS NF Bold Italic
font_size        11.0

# ------------------------------------------------------------------------------
# Tema & Apariencia General
# ------------------------------------------------------------------------------
include current-theme.conf

# ------------------------------------------------------------------------------
# Barra de Pestañas (Tab Bar con Python Stats)
# ------------------------------------------------------------------------------
tab_bar_edge            bottom
tab_bar_style           custom
tab_bar_min_tabs        1
active_tab_foreground   #11111b
active_tab_background   #cba6f7
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# ------------------------------------------------------------------------------
# Ratón & Portapapeles
# ------------------------------------------------------------------------------
copy_on_select clipboard
mouse_map right press ungrabbed paste_from_clipboard

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ------------------------------------------------------------------------------
# Layouts & División de Paneles (Estilo Terminator)
# ------------------------------------------------------------------------------
enabled_layouts splits,stack

# División vertical y horizontal en el directorio actual
map ctrl+shift+e launch --location=vsplit --cwd=current
map ctrl+shift+o launch --location=hsplit --cwd=current

# Cerrar panel activo
map ctrl+shift+w close_window

# Navegación entre paneles con Alt + Flechas
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Redimensionar paneles
map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter

# Zoom / Pantalla completa del panel activo
map ctrl+shift+x toggle_layout stack

# ------------------------------------------------------------------------------
# Gestión de Pestañas
# ------------------------------------------------------------------------------
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+page_down next_tab
map ctrl+page_up   previous_tab
map ctrl+shift+alt+t set_tab_title

# Acceso rápido por número de pestaña
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# ------------------------------------------------------------------------------
# Scroll & Navegación del Historial
# ------------------------------------------------------------------------------
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end
map ctrl+shift+k         clear_terminal to_cursor active
map ctrl+shift+h         show_scrollback

# ------------------------------------------------------------------------------
# Productividad & Control de Kitty
# ------------------------------------------------------------------------------
# Abrir URLs visibles directamente
map ctrl+shift+u open_url_with_hints

# Zoom tipográfico
map ctrl+equal     change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+backspace change_font_size all 0

# Recargar configuración al vuelo
map ctrl+shift+f5 load_config_file